name: Publish patched image (GHCR)

# Builds this fork's patched Sequin image and pushes it to GHCR for interim use before the upstream fix ships.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (also used as RELEASE_VERSION)"
        required: false
        default: "fix-2150"
  push:
    branches:
      - ci/publish-patched-ghcr

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/sequin
  TAG: ${{ github.event.inputs.tag || 'fix-2150' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            SELF_HOSTED=1
            RELEASE_VERSION=${{ env.TAG }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"

      - name: Print pull reference
        run: echo "Pushed ${IMAGE}:${TAG} (linux/amd64, linux/arm64)"
